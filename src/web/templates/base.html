<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Grokbotclon Operator Console{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 1.5rem; color: #111827; background: #f9fafb; }
    header { margin-bottom: 1.5rem; border-bottom: 1px solid #d1d5db; padding-bottom: 0.75rem; }
    main { max-width: 1100px; }
    section { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 1rem; margin-bottom: 1.25rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { border: 1px solid #e5e7eb; padding: 0.45rem 0.6rem; text-align: left; font-size: 0.9rem; }
    th { background: #f3f4f6; }
    .banner { padding: 0.75rem; border-radius: 4px; margin-bottom: 0.75rem; }
    .banner-warn { background: #fef3c7; border: 1px solid #f59e0b; }
    .banner-danger { background: #fee2e2; border: 1px solid #ef4444; }
    .banner-info { background: #dbeafe; border: 1px solid #3b82f6; }
    label { display: block; margin-top: 0.5rem; font-weight: 600; font-size: 0.9rem; }
    input[type="text"], textarea { width: 100%; max-width: 560px; padding: 0.4rem; margin-top: 0.2rem; }
    button { margin-top: 0.6rem; padding: 0.45rem 0.9rem; cursor: pointer; }
    code, pre { background: #f3f4f6; padding: 0.15rem 0.35rem; border-radius: 3px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary Navigation">
      <a href="/">Operator Dashboard</a>
      <a href="/app" style="margin-left: 1rem;">ControlBot Studio</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
